name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify:
    name: Gate - canary source + mask cross-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify canary source sha
        run: python3 canary_check.py

      - name: Cross-check mask implementations
        run: |
          python3 mask_check_static.py
          python3 mask_check.py
          node mask_check.js

  build:
    name: Assemble Debug + Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Grant execute permission for gradlew
        if: hashFiles('gradlew') != ''
        run: chmod +x gradlew

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK (R8 test)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify canary bytes packed into APK
        run: python3 canary_check.py

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zagent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: zagent-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
