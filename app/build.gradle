plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def cfg = { String key -> localProps.getProperty(key) ?: System.getenv(key) ?: "" }

android {
    namespace 'cn.rain.zagent'
    compileSdk 37

    defaultConfig {
        applicationId "cn.rain.zagent"
        minSdk 26
        targetSdk 37
        versionCode 23
        versionName "3.1"

        ndk {

            abiFilters "arm64-v8a", "x86_64"
        }

        buildConfigField "String", "ZAGENT_API_KEY", "\"${cfg('ZAGENT_API_KEY')}\""
        buildConfigField "String", "ZAGENT_EXPECTED_SIGNATURE", "\"${cfg('ZAGENT_EXPECTED_SIGNATURE')}\""
    }

    def ksFile = cfg('RELEASE_STORE_FILE')
    if (ksFile) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storePassword cfg('RELEASE_STORE_PASSWORD')
                keyAlias cfg('RELEASE_KEY_ALIAS')
                keyPassword cfg('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            ndk {
                debugSymbolLevel 'NONE'
            }
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        pyc { src = false }
        pip {
            install "requests"
            install "pillow"
            install "pypdf"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}